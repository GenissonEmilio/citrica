name: Windows engines from corresponding source
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-engines:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      PYTHONUTF8: '1'
      CITRICA_BUILD_JOBS: '2'
      CITRICA_SIGNING_REQUIRED: '0'
      CITRICA_SIGN_CERT_SHA1: ''
      CITRICA_WINDOWS_ENGINES: ${{ github.workspace }}/build/windows-source-engines
      CITRICA_RELEASE_REQUIRE_ENGINE_SOURCES: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        id: msys
        with:
          msystem: MINGW64
          location: C:\msys64
          update: true
          install: >-
            base-devel
            perl
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
      - name: Compile codecs and OCR, preserve corresponding source
        env:
          CITRICA_MSYS_BASH: ${{ steps.msys.outputs.msys2-location }}/usr/bin/bash.exe
        run: python packaging/build_windows_source_engines.py
      - name: Python application dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
      - name: Application tests with source-built engines
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Offline package and complete conversion/tool matrix
        run: python packaging/build_windows.py
      - name: Mark source-engine candidate as unsigned test
        if: always() && hashFiles('release/citrica-windows-signing.json') != ''
        shell: pwsh
        run: |
          $trust = Get-Content release/citrica-windows-signing.json -Raw | ConvertFrom-Json
          if ($trust.status -ne 'unsigned' -or $trust.authenticode_verified) {
            throw 'Source-engine QA candidate must remain unsigned.'
          }
          foreach ($file in Get-ChildItem release -File | Where-Object { $_.Extension -in @('.exe', '.zip') -and $_.BaseName -notlike '*-unsigned-test' }) {
            Rename-Item $file.FullName ($file.BaseName + '-unsigned-test' + $file.Extension)
          }
          'UNSIGNED SOURCE-ENGINE TEST BUILD. Publisher is not verified. Not a public release.' | Out-File release/UNSIGNED-TEST-BUILD.txt -Encoding utf8
          python -c "import hashlib; from pathlib import Path; p=Path('release'); (p/'SHA256SUMS-windows.txt').write_text(''.join(f'{hashlib.sha256(f.read_bytes()).hexdigest()}  {f.name}\n' for f in sorted(p.iterdir()) if f.is_file() and not f.name.startswith('SHA256SUMS')), encoding='utf-8')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: citrica-windows-source-engine-candidate-unsigned-test
          path: release/*
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-source-engine-build-records
          path: |
            build/windows-source-engines/engines.json
            build/windows-source-engines/engine-files.sha256.json
            build/windows-source-engines/engine-sources.zip
            build/windows-source-build/**/config.log
            build/windows-source-build/**/CMakeCache.txt
            build/windows-source-build/**/*version.txt
            build/windows-source-build/**/msys2-packages.txt
            build/windows-engine-cache/*.log
          retention-days: 14
