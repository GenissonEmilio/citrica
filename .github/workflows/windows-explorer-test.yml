name: Validar Explorer Windows por código-fonte
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  explorer:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      CITRICA_WINDOWS_ENGINES: ${{ github.workspace }}/build/windows-engines
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Dependências Python
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
      - name: Preparar os mesmos motores offline do pacote
        shell: pwsh
        run: |
          $sevenZip = Get-Command 7z.exe -ErrorAction SilentlyContinue
          if (!$sevenZip -and !(Test-Path "$env:ProgramFiles\7-Zip\7z.exe")) {
            throw '7-Zip ausente no runner.'
          }
          python packaging/prepare_windows_engines.py
          if ($LASTEXITCODE -ne 0) { throw 'Falha na preparação dos motores offline.' }
      - name: Explorer real, Ctrl, Alt e DOCX/PDF
        run: python tests/windows/explorer_flow.py --source
      - name: Explorer real com escala Qt de 150%
        env:
          QT_SCALE_FACTOR: '1.5'
        run: python tests/windows/explorer_flow.py --source
      - name: Conversões seguidas na mesma pasta do Explorer
        env:
          QT_SCALE_FACTOR: '1.5'
        run: python tests/windows/explorer_flow.py --source --same-folder
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-explorer-source-evidence
          path: |
            release/*.json
            release/*.png
            build/windows-explorer-*/**/*.json
            build/windows-explorer-*/**/*.log
            build/windows-engine-cache/*.log
          retention-days: 7
