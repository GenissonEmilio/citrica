name: Testes e release Linux
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Dependências Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libreoffice-writer libreoffice-calc libreoffice-impress rpm libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-xfixes0 libfontconfig1 libdbus-1-3
      - name: Dependências Python
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
      - name: Lint
        run: ruff check citrica tests packaging
      - name: Testes reais de conversão e interface
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Pacotes Linux x86_64
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: python packaging/build.py
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: citrica-linux-x86_64
          path: release/*
          retention-days: 14
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: linux
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: citrica-linux-x86_64
          path: release
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "Cítrica $GITHUB_REF_NAME · Linux" --notes-file docs/RELEASE.md --prerelease
