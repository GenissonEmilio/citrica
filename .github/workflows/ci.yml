name: Testes e release Linux e Windows
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Dependências Linux
        run: |
          # The runner's Azure mirror can throttle large Office downloads.
          # Use Ubuntu's main archive for reproducible package preparation.
          sudo python3 - <<'PY'
          from pathlib import Path
          for path in [Path('/etc/apt/sources.list'), *Path('/etc/apt/sources.list.d').glob('*')]:
              if path.is_file() and path.suffix in {'.list', '.sources'}:
                  source = path.read_text()
                  updated = source.replace('http://azure.archive.ubuntu.com/ubuntu',
                                           'https://archive.ubuntu.com/ubuntu')
                  if source != updated:
                      path.write_text(updated)
          PY
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg libreoffice-writer libreoffice-calc libreoffice-impress rpm libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-xfixes0 libfontconfig1 libdbus-1-3 tesseract-ocr-eng libtesseract5
      - name: Dependências Python
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
      - name: Lint
        run: ruff check citrica tests packaging
      - name: Testes reais de conversão e interface
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Pacotes Linux x86_64
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: python packaging/build.py
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: citrica-portable-x86_64
          path: release/*.tar.gz
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: citrica-native-packages
          path: |
            release/*.rpm
            release/*.deb
            release/*.png
            release/SHA256SUMS
          retention-days: 14
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: citrica-*
          merge-multiple: true
          path: release
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path('release')
          files = [p for p in sorted(root.iterdir()) if not p.name.startswith('SHA256SUMS')]
          (root / 'SHA256SUMS').write_text(''.join(f"{hashlib.file_digest(p.open('rb'), 'sha256').hexdigest()}  {p.name}\n" for p in files))
          PY
          gh release create "$GITHUB_REF_NAME" release/* --title "Cítrica $GITHUB_REF_NAME · Linux e Windows" --notes-file docs/RELEASE.md --draft
  windows:
    runs-on: windows-2022
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Motores externos para os testes Windows
        shell: pwsh
        run: |
          # Keep this runner free of Office: missing LibreOffice was one of the
          # reported failures. Optional LibreOffice paths remain covered on Linux.
          choco install ffmpeg tesseract --yes --no-progress --execution-timeout=600
          if ($LASTEXITCODE -notin @(0, 1641, 3010)) { throw "Falha nas dependências Windows: $LASTEXITCODE" }
      - name: Dependências Python
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
      - name: Testes reais do motor e interface Qt no Windows
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Instalador e portátil Windows x64
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: python packaging/build_windows.py
      - name: Arraste OLE e atalhos no desktop Windows do CI
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: python tests/windows/native_flow.py dist/Citrica/Citrica.exe
      - name: Instalar, abrir e desinstalar o pacote Windows
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $version = python -c "from citrica import __version__; print(__version__)"
          python tests/windows/install_smoke.py "release/citrica-$version-windows-x86_64-setup.exe"
      - name: Explorer real, Ctrl, Alt e documentos sem LibreOffice
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: python tests/windows/explorer_flow.py dist/Citrica/Citrica.exe
      - name: Explorer real com escala Qt de 150%
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          QT_SCALE_FACTOR: '1.5'
        run: python tests/windows/explorer_flow.py dist/Citrica/Citrica.exe
      - name: Conversões seguidas na mesma pasta do Explorer
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          QT_SCALE_FACTOR: '1.5'
        run: python tests/windows/explorer_flow.py dist/Citrica/Citrica.exe --same-folder
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: citrica-windows-x86_64
          path: release/*
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-debug
          path: |
            build/windows-native/**/*.json
            build/windows-native/**/*.log
            build/windows-installer/*.log
            build/windows-explorer-*/**/*.json
            build/windows-explorer-*/**/*.log
            release/*.png
            release/*validation.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: success() && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
        with:
          name: windows-validation-evidence
          path: |
            release/*.json
            release/*.png
          retention-days: 14
