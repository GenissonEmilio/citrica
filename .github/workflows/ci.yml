name: Testes e release Linux e Windows
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Dependências Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libreoffice-writer libreoffice-calc libreoffice-impress rpm libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-xfixes0 libfontconfig1 libdbus-1-3 tesseract-ocr-eng libtesseract5
      - name: Dependências Python
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
      - name: Lint
        run: ruff check citrica tests packaging
      - name: Testes reais de conversão e interface
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Pacotes Linux x86_64
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: python packaging/build.py
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: citrica-portable-x86_64
          path: release/*.tar.gz
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: citrica-native-packages
          path: |
            release/*.rpm
            release/*.deb
            release/*.png
            release/SHA256SUMS
          retention-days: 14
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: citrica-*
          merge-multiple: true
          path: release
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path('release')
          files = [p for p in sorted(root.iterdir()) if not p.name.startswith('SHA256SUMS')]
          (root / 'SHA256SUMS').write_text(''.join(f"{hashlib.file_digest(p.open('rb'), 'sha256').hexdigest()}  {p.name}\n" for p in files))
          PY
          gh release create "$GITHUB_REF_NAME" release/* --title "Cítrica $GITHUB_REF_NAME · Linux e Windows" --notes-file docs/RELEASE.md --draft
  windows:
    runs-on: windows-2022
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Motores externos para os testes Windows
        shell: pwsh
        run: |
          choco install ffmpeg libreoffice-fresh tesseract --yes --no-progress
          if ($LASTEXITCODE -notin @(0, 1641, 3010)) { throw "Falha nas dependências Windows: $LASTEXITCODE" }
          "C:\Program Files\LibreOffice\program" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\Program Files\Tesseract-OCR" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Dependências Python
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
      - name: Testes reais do motor e interface Qt no Windows
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Instalador e portátil Windows x64
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: python packaging/build_windows.py
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: citrica-windows-x86_64
          path: release/*
          retention-days: 14
