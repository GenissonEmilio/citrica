name: Validar Authenticode Windows isoladamente
on:
  push:
    branches: [codex/windows-ubuntu-compatibility, codex/microsoft-store-package]
    paths:
      - '.github/workflows/windows-signing-test.yml'
      - 'packaging/sign_windows.py'
      - 'tests/test_windows_signing.py'
      - 'packaging/windows_stop.*'
      - 'tests/test_windows_stop_helper.py'
      - 'packaging/windows_package.*'
      - 'citrica/windows/package.py'
      - 'tests/test_windows_package.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signing-tests:
    runs-on: windows-2022
    timeout-minutes: 5
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar somente o runner de testes
        run: python -m pip install pytest==9.1.1
      - name: Windows PowerShell 5.1, Unicode, sem console e módulos contaminados
        run: python -m pytest -q -rA tests/test_windows_signing.py
  native-stop-tests:
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Headless named-pipe test dependencies only
        run: python -m pip install pytest==9.1.1 PySide6-Essentials==6.12.0 shiboken6==6.12.0
      - name: Compile independent installer helper with the static CRT
        run: python packaging/windows_stop.py
      - name: Real process exit, shutdown race, Unicode pipe and installation isolation
        run: python -m pytest tests/test_windows_stop_helper.py -q -rA --junitxml=build/windows-stop-tests.xml
      - name: Keep helper and native test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-native-stop-helper-test
          path: |
            build/windows-package/citrica-stop.exe
            build/windows-stop-tests.xml
  native-package-tests:
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Headless package bridge test dependencies
        run: python -m pip install pytest==9.1.1 PySide6-Essentials==6.12.0 shiboken6==6.12.0
      - name: Compile package StartupTask and ApplicationData helper with the static CRT
        run: python packaging/windows_package.py
      - name: Package identity, StartupTask bridge and unpackaged behavior
        env:
          CITRICA_PACKAGE_HELPER: ${{ github.workspace }}/build/windows-package/citrica-package.exe
        run: python -m pytest tests/test_windows_package.py -q -rA --junitxml=build/windows-package-tests.xml
      - name: Preserve helper and native results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-native-package-helper-test
          path: |
            build/windows-package/citrica-package.exe
            build/windows-package-tests.xml
