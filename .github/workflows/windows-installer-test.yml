name: Validar instalador Windows existente
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Run de build com o artefato citrica-windows-x86_64
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  installer:
    runs-on: windows-2022
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: citrica-windows-x86_64
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: candidate
      - name: Instalar, abrir e desinstalar
        run: python tests/windows/install_smoke.py candidate/citrica-0.4.0-windows-x86_64-setup.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer-validation
          path: |
            release/*
            build/windows-installer/*.log
