[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "citrica"
version = "0.2.0"
description = "Conversão de arquivos local e radial para Linux"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
authors = [{name = "GenissonEmilio"}]
dependencies = [
  "PySide6-Essentials>=6.8,<7", "Pillow>=11,<13", "pillow-heif>=0.22,<2",
  "pypdf>=5,<7", "PyMuPDF>=1.25,<2",
  "zxing-cpp>=3.1,<4",
  "opencv-python-headless>=4.10,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "pyinstaller>=6,<7", "qrcode>=8,<9"]

[project.scripts]
citrica = "citrica.__main__:main"

[project.urls]
Homepage = "https://github.com/GenissonEmilio/citrica"
Issues = "https://github.com/GenissonEmilio/citrica/issues"

[tool.setuptools.package-data]
citrica = ["assets/*.svg"]

[tool.setuptools.packages.find]
include = ["citrica*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

